<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Reading Mode</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 300px;
  background: #0a0a0a;
  color: #d4d4d4;
  font-family: 'JetBrains Mono', monospace, monospace;
  font-size: 12px;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid #1e1e1e;
}
.logo { font-size: 14px; font-weight: 700; color: #fff; }
.version { font-size: 10px; color: #444; background: #111; padding: 2px 6px; border-radius: 4px; }

.stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid #1e1e1e;
}
.stat { padding: 12px; text-align: center; border-right: 1px solid #1e1e1e; }
.stat:last-child { border-right: none; }
.stat-val { font-size: 20px; font-weight: 700; color: #fff; line-height: 1; }
.stat-lbl { font-size: 9px; color: #444; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px; border-bottom: 1px solid #1e1e1e; }
.btn {
  background: #111; border: 1px solid #1e1e1e; border-radius: 6px;
  color: #d4d4d4; font-family: inherit; font-size: 11px;
  padding: 9px 10px; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 6px; transition: all 0.15s;
}
.btn:hover { border-color: #3b82f6; color: #fff; background: #141414; }

.key-section { padding: 12px 16px; border-bottom: 1px solid #1e1e1e; }
.key-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.key-row { display: flex; gap: 6px; }
.key-input {
  flex: 1; background: #111; border: 1px solid #1e1e1e; border-radius: 6px;
  color: #d4d4d4; font-family: inherit; font-size: 11px; padding: 7px 10px; outline: none;
}
.key-input:focus { border-color: #3b82f6; }
.key-input::placeholder { color: #333; }
.save-btn {
  background: #3b82f6; border: none; border-radius: 6px;
  color: #fff; font-family: inherit; font-size: 11px; font-weight: 600;
  padding: 7px 12px; cursor: pointer;
}
.save-btn:hover { background: #2563eb; }
.key-hint { font-size: 10px; color: #333; margin-top: 6px; }
.key-hint a { color: #3b82f6; text-decoration: none; }

#status { display: none; font-size: 10px; padding: 6px 16px; text-align: center; }

.shortcuts { padding: 12px 16px; }
.sc-title { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.sc-row { display: flex; justify-content: space-between; padding: 3px 0; }
.sc-lbl { color: #555; }
.keys { display: flex; gap: 2px; }
kbd {
  background: #111; border: 1px solid #1e1e1e; border-radius: 3px;
  color: #888; font-family: inherit; font-size: 10px; padding: 1px 5px;
}
</style>
</head>
<body>

<div class="header">
  <span class="logo">⚡ Smart Reader</span>
  <span class="version">v1.1</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="stat-h">0</div><div class="stat-lbl">Highlights</div></div>
  <div class="stat"><div class="stat-val" id="stat-p">0</div><div class="stat-lbl">Pages</div></div>
  <div class="stat"><div class="stat-val" id="stat-t">0</div><div class="stat-lbl">Hours</div></div>
</div>

<div class="actions">
  <button class="btn" id="btn-rm">📖 Reading Mode</button>
  <button class="btn" id="btn-sidebar">⚡ Open Sidebar</button>
  <button class="btn" id="btn-summarize">🤖 Summarize</button>
  <button class="btn" id="btn-export">📥 Export</button>
</div>

<div class="key-section">
  <div class="key-label">Groq API Key</div>
  <div class="key-row">
    <input type="password" class="key-input" id="key-input" placeholder="gsk_..." />
    <button class="save-btn" id="save-key">Save</button>
  </div>
  <p class="key-hint">Free key at <a href="https://console.groq.com" target="_blank">console.groq.com</a> — no credit card</p>
</div>

<div id="status"></div>

<div class="shortcuts">
  <div class="sc-title">Shortcuts</div>
  <div class="sc-row"><span class="sc-lbl">Reading Mode</span><div class="keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>R</kbd></div></div>
  <div class="sc-row"><span class="sc-lbl">Sidebar</span><div class="keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd></div></div>
  <div class="sc-row"><span class="sc-lbl">Dismiss</span><div class="keys"><kbd>Esc</kbd></div></div>
</div>

<script src="src/popup.js"></script>
</body>
</html>
